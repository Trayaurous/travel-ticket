<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Travel Ticket</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="ticket-app">
        <main class="preview-pane">
            <div class="ticket-header">
                <button class="round-btn" type="button" id="resetBtn" title="重置">
                    <i class="bi bi-arrow-counterclockwise"></i>
                </button>
                <div class="brand-title">Travel Ticket</div>
                <button class="round-btn" type="button" id="uploadBtn" title="上传图片">
                    <i class="bi bi-images"></i>
                </button>
            </div>

            <div class="stage" id="stage">
                <canvas id="ticketCanvas" width="1200" height="1200"></canvas>
                <div class="empty-drop" id="emptyDrop">
                    <i class="bi bi-image"></i>
                    <span>点击上传图片</span>
                </div>
            </div>
        </main>

        <aside class="control-pane">
            <section class="section text-section">
                <div class="section-title"><i class="bi bi-type"></i> 文字</div>
                <div class="field">
                    <label for="titleInput">标题</label>
                    <textarea id="titleInput" rows="4" maxlength="80">TRIP</textarea>
                </div>
                <div class="field">
                    <label for="line1Input">小字 1</label>
                    <input id="line1Input" value="TravelTicket">
                </div>
                <div class="field">
                    <label for="line2Input">小字 2</label>
                    <input id="line2Input" value="next station">
                </div>
                <div class="field">
                    <label for="dateInput">日期</label>
                    <input id="dateInput" value="2026 - 06">
                </div>
                <div class="field">
                    <label>字体</label>
                    <div class="font-picker" id="fontPicker">
                        <button class="font-trigger" id="fontMenuTrigger" type="button" aria-label="选择字体" aria-expanded="false">
                            <span class="font-trigger-copy">
                                <strong id="generalFontLabel">System Sans</strong>
                                <small id="chineseFontLabel" hidden></small>
                            </span>
                            <i class="bi bi-chevron-down"></i>
                        </button>
                        <div class="font-menu" id="fontMenu" role="menu" aria-hidden="true">
                            <div class="font-menu-column">
                                <div class="font-menu-title">通用字体</div>
                                <button class="font-option active" type="button" data-general-font="system">System Sans</button>
                                <button class="font-option" type="button" data-general-font="poster">Bold Poster</button>
                                <button class="font-option" type="button" data-general-font="mono">Ticket Mono</button>
                                <button class="font-option" type="button" data-general-font="serif">Editorial Serif</button>
                            </div>
                            <div class="font-menu-column chinese-font-column">
                                <div class="font-menu-title">中文字体</div>
                                <button class="font-option active" type="button" data-chinese-font="inherit">通用</button>
                                <button class="font-option" type="button" data-chinese-font="kaiti">毛笔手写</button>
                                <button class="font-option" type="button" data-chinese-font="xingkai">行草艺术</button>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="section layout-section">
                <div class="section-title"><i class="bi bi-layout-three-columns"></i> 排版格式</div>
                <div class="layout-grid">
                    <button class="chip active" type="button" data-layout="classic">经典横票</button>
                    <button class="chip" type="button" data-layout="compact">紧凑票</button>
                    <button class="chip" type="button" data-layout="wide">wide相纸</button>
                    <button class="chip" type="button" data-layout="sq">sq相纸</button>
                </div>
            </section>

            <section class="section color-section">
                <div class="section-title"><i class="bi bi-eyedropper"></i> 颜色</div>
                <div id="colorPickers"></div>
            </section>

            <section class="section effect-section">
                <div class="section-title"><i class="bi bi-sliders"></i> 效果</div>
                <label class="effect-field" for="shadowInput">
                    <span class="effect-field-heading">阴影强度</span>
                    <span class="stepped-range">
                        <input id="shadowInput" type="range" min="0" max="3" step="1" value="1">
                        <span class="range-ticks" aria-hidden="true"><i></i><i></i><i></i><i></i></span>
                    </span>
                </label>
                <label class="effect-field" for="angleInput">
                    <span class="effect-field-heading">
                        <span>倾斜角度</span>
                        <output id="angleOutput" for="angleInput">0°</output>
                    </span>
                    <input id="angleInput" type="range" min="-15" max="15" step="1" value="0">
                </label>
            </section>

            <section class="section ratio-section">
                <div class="section-title"><i class="bi bi-aspect-ratio"></i> 导出比例</div>
                <div class="ratio-grid">
                    <button class="chip active" type="button" data-ratio="1:1">1:1</button>
                    <button class="chip" type="button" data-ratio="3:2">3:2</button>
                    <button class="chip" type="button" data-ratio="2:3">2:3</button>
                    <button class="chip" type="button" data-ratio="16:9">16:9</button>
                    <button class="chip" type="button" data-ratio="9:16">9:16</button>
                </div>
            </section>

            <button class="primary-btn" type="button" id="exportBtn">
                <i class="bi bi-download"></i> 保存
            </button>
        </aside>
    </div>

    <input id="imageInput" type="file" accept="image/*" hidden>
    <script src="./app.js"></script>
</body>
</html>
